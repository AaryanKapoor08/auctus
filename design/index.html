<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Auctus — Canadian funding discovery</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Anton&family=Bagel+Fat+One&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin:0; padding:0; background:#F3EFE3; font-family: 'Inter', system-ui, sans-serif; color:#0E0E10; }
  * { box-sizing: border-box; }

  .auctus-page { font-family: 'Inter', system-ui, sans-serif; color:#0E0E10; min-height:100vh; }
  .display { font-family: 'Archivo Black', sans-serif; letter-spacing:-0.02em; }
  .display-cond { font-family: 'Anton', sans-serif; letter-spacing:0.01em; }
  .kiki { font-family: 'Bagel Fat One', 'Lilita One', sans-serif; letter-spacing:-0.01em; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  /* Marquee animation — shared by navbar strip + section dividers */
  @keyframes auc-marquee {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  .auc-marquee-track {
    display: inline-flex;
    gap: 48px;
    white-space: nowrap;
    animation: auc-marquee 38s linear infinite;
    will-change: transform;
  }
  .auc-marquee-track.slow { animation-duration: 60s; }

  /* Section anchors */
  section { scroll-margin-top: 120px; }

  /* Auto-summary animation for Automate section */
  @keyframes auc-pop {
    0%, 100% { opacity: 0; transform: translateY(8px) scale(.98); }
    8%, 92%  { opacity: 1; transform: translateY(0)   scale(1); }
  }
  @keyframes auc-btn {
    0%, 30%, 100% { transform: scale(1); }
    8%            { transform: scale(0.94); }
    12%           { transform: scale(1); }
  }
  .auc-summary-loop { animation: auc-pop 6.5s ease-in-out infinite; }
  .auc-btn-loop     { animation: auc-btn 6.5s ease-in-out infinite; }

  /* Nav link hover */
  .auc-nav-link:hover { background: rgba(255,255,255,0.08); color:#fff !important; }

  /* Smooth anchor scroll */
  html { scroll-behavior: smooth; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
